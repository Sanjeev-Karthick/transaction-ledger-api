name: transaction-ledger-api

x-app: &app
  image: transaction-ledger-api:local
  build: .
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  environment: &app-env
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DATABASE_URL: postgresql://${POSTGRES_USER:-ledger}:${POSTGRES_PASSWORD:?Copy .env.example to .env first}@db:5432/${POSTGRES_DB:-ledger}
    DB_POOL_MAX: ${DB_POOL_MAX:-10}
    DB_SSL: 'false'
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DOCS_ENABLED: ${DOCS_ENABLED:-false}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    TRUST_PROXY: ${TRUST_PROXY:-}
    RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ledger}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-ledger}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    <<: *app
    command: [node, src/db/migrate.js]
    restart: 'no'
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *app
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    stop_grace_period: 20s
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
